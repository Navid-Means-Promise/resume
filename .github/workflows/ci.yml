name: Verify

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Verify content, site, PDFs, and responsive layouts
        env:
          BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run check

      - name: Upload verified site
        uses: actions/upload-artifact@v4
        with:
          name: resume-site
          path: dist
          if-no-files-found: error
          retention-days: 7
